name: Worker Check

on:
  workflow_call:
    outputs:
      has_new_version:
        description: "Whether semantic-release would produce a new version"
        value: ${{ jobs.check.outputs.has_new_version }}
      current_version:
        description: "The version currently declared by the public crate"
        value: ${{ jobs.check.outputs.current_version }}
      next_version:
        description: "The next version selected by semantic-release"
        value: ${{ jobs.check.outputs.next_version }}
      current_version_published:
        description: "Whether crates.io and the GitHub release contain current_version"
        value: ${{ jobs.check.outputs.current_version_published }}
      current_version_publication_state:
        description: "Whether current_version is complete, partial, or absent"
        value: ${{ jobs.check.outputs.current_version_publication_state }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_new_version: ${{ steps.check.outputs.has_new_version }}
      current_version: ${{ steps.check.outputs.current_version }}
      next_version: ${{ steps.check.outputs.next_version }}
      current_version_published: ${{ steps.check.outputs.current_version_published }}
      current_version_publication_state: ${{ steps.check.outputs.current_version_publication_state }}
    steps:
      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BEZOTCORP_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.BEZOTCORP_RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release state
        id: check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./scripts/check-release-state.sh cycle-paradox-extension-api "${{ github.repository }}"
